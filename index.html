<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتائج مسابقة القرآن الكريم – مسجد النور</title>
<meta name="description" content="الاستعلام عن نتيجة مسابقة القرآن الكريم بمسجد النور برقم المتسابق">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#093528;--green:#0e4a3a;--mint:#e6efe9;--page:#f3f6f4;--card:#fff;--ink:#14302a;--mute:#5c726a;--brass:#b8893a;--brass2:#e3c47d;--line:#d6e1da;--bad:#8a3b2e;--star:#fff}
@media (prefers-color-scheme:dark){:root{--deep:#06201a;--green:#0b3a2e;--mint:#16312a;--page:#0c1a16;--card:#122622;--ink:#e8f0ea;--mute:#9db3a9;--brass:#d9aa4a;--brass2:#f0d28c;--line:#254038;--bad:#e5a595}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;background:#093528 url(mosque.jpg) center 72%/cover no-repeat;color:#f5f8f4;text-align:center;padding:64px 20px 118px;overflow:hidden;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,32,26,.62),rgba(9,53,40,.88))}
.hero>*{position:relative}
.bism{font-family:Amiri,serif;font-size:clamp(20px,4vw,28px);color:var(--brass2);margin:0 0 14px}
.hero h1{font-family:Amiri,serif;font-weight:700;font-size:clamp(32px,7vw,56px);line-height:1.35;margin:0}
.hero p{margin:10px 0 0;font-size:clamp(15px,2.6vw,18px);opacity:.88}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 0;max-width:260px;color:var(--brass2)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass2))}
.rule::after{transform:scaleX(-1)}
.rule i{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--brass2)}
main{flex:1;width:100%;max-width:680px;margin:-62px auto 0;padding:0 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 18px 40px -22px rgba(6,32,26,.45)}
.panel label{display:block;font-weight:700;font-size:17px;margin-bottom:4px}
.hint{color:var(--mute);font-size:14px;margin:0 0 14px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:600;letter-spacing:.04em;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:var(--page);color:inherit;direction:ltr;text-align:center}
input::placeholder{font-weight:400;letter-spacing:0;color:var(--mute)}
input:focus,button:focus-visible{outline:none;border-color:var(--brass);box-shadow:0 0 0 4px rgba(184,137,58,.25)}
button{font:inherit;font-weight:700;padding:13px 26px;border:0;border-radius:12px;background:var(--green);color:#fff;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--deep)}button:active{transform:scale(.98)}button:disabled{opacity:.6;cursor:wait}
@media (prefers-color-scheme:dark){button{background:var(--brass);color:#1a1405}button:hover{background:var(--brass2)}}
.err{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:rgba(138,59,46,.1);color:var(--bad);font-weight:600}
.cert{margin-top:22px;border:2px solid var(--brass);border-radius:14px;padding:6px;animation:rise .45s ease-out both}
.cert-in{border:1px solid var(--brass);border-radius:9px;padding:26px 22px;text-align:center;background:var(--card)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cert{animation:none}}
.kicker{margin:0;color:var(--mute);font-size:14px}
.cert h2{font-family:Amiri,serif;font-size:clamp(30px,6vw,40px);line-height:1.4;margin:2px 0 8px;color:var(--green)}
@media (prefers-color-scheme:dark){.cert h2{color:var(--brass2)}}
.badge{display:inline-block;padding:3px 16px;border-radius:99px;background:var(--mint);color:var(--green);font-weight:700;font-size:15px}
@media (prefers-color-scheme:dark){.badge{color:var(--brass2)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 4px}
.stat{padding:12px 6px;border-radius:12px;background:var(--page);border:1px solid var(--line)}
.stat b{display:block;font-size:26px;line-height:1.3}.stat span{font-size:13px;color:var(--mute)}
.stat.rank{border-color:var(--brass);background:linear-gradient(180deg,rgba(184,137,58,.16),rgba(184,137,58,.04))}
.stat.rank b{color:var(--brass)}
.msg{margin:18px 0 0;padding:16px 18px;border-radius:12px;font-family:Amiri,serif;font-size:clamp(20px,3.6vw,24px);line-height:2;background:rgba(14,74,58,.07);border-right:5px solid var(--green)}
.msg.no{background:rgba(138,59,46,.07);border-color:var(--bad)}
.actions{margin-top:16px;text-align:center}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9px 20px;font-size:15px}
.ghost:hover{background:var(--mint);color:var(--ink)}
#top{margin-top:26px}
#top h3{font-family:Amiri,serif;font-size:26px;margin:22px 0 8px;color:var(--green)}
@media (prefers-color-scheme:dark){#top h3{color:var(--brass2)}}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl div{display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.tbl div:last-child{border:0}.tbl .n{color:var(--brass);font-weight:800}.tbl .s{font-weight:700}
footer{text-align:center;color:var(--mute);font-size:14px;padding:22px 16px 30px}
@media (max-width:480px){.row{flex-direction:column}.panel{padding:20px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat b{font-size:22px}}
@media print{.hero::before,.panel>:not(#out),.actions,#top,footer{display:none!important}.hero{background:none;color:#000;padding:10px}.bism,.hero p{color:#000}main{margin:0}.panel{border:0;box-shadow:none}}
</style>
</head>
<body>
<header class="hero">
  <p class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
  <h1>مسابقة القرآن الكريم</h1>
  <p>مسجد النور · نتائج المتسابقين</p>
  <div class="rule"><i></i></div>
</header>
<main>
  <section class="panel">
    <label for="num">الاستعلام عن النتيجة</label>
    <p class="hint">اكتب رقم المتسابق كما هو مدوّن في بطاقتك.</p>
    <div class="row">
      <input id="num" inputmode="numeric" autocomplete="off" placeholder="رقم المتسابق" aria-label="رقم المتسابق">
      <button id="go">عرض النتيجة</button>
    </div>
    <div id="out" aria-live="polite"></div>
  </section>
  <section id="top"></section>
</main>
<footer>مسابقة القرآن الكريم · مسجد النور — تقبّل الله منا ومنكم</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(CFG.URL, CFG.KEY);
const $ = id => document.getElementById(id);
const norm = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const el = (t, txt, cls) => { const e = document.createElement(t); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
const ORD = {1:'الأول',2:'الثاني',3:'الثالث'};
const stat = (v, l, cls) => { const d = el('div', null, 'stat ' + (cls || '')); d.append(el('b', v), el('span', l)); return d; };

async function search() {
  const n = norm($('num').value), out = $('out');
  out.replaceChildren();
  if (!n) { out.append(el('p', 'اكتب رقم المتسابق أولًا.', 'err')); return; }
  $('go').disabled = true; $('go').textContent = 'جارٍ البحث…';
  const { data, error } = await db.rpc('get_result', { p_number: n });
  $('go').disabled = false; $('go').textContent = 'عرض النتيجة';
  if (error) { out.append(el('p', 'تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.', 'err')); return; }
  if (!data) { out.append(el('p', 'لا توجد نتيجة بهذا الرقم. تأكد من الرقم وحاول مرة أخرى.', 'err')); return; }
  const cert = el('div', null, 'cert'), inn = el('div', null, 'cert-in');
  const stats = el('div', null, 'stats');
  stats.append(stat(data.hifz + ' / 70', 'الحفظ'), stat(data.tajweed + ' / 30', 'التجويد'),
    stat(data.score + ' / 100', 'المجموع'), stat(ORD[data.rank] || data.rank, 'المركز في الفرع', 'rank'));
  inn.append(el('p', 'نتيجة المتسابق رقم ' + data.number, 'kicker'), el('h2', data.name), el('span', data.branch, 'badge'), stats,
    data.passed
      ? el('div', 'بارك الله فيك يا ' + data.name + '، وجعل القرآن ربيع قلبك ونور صدرك ومؤنسك في دنياك وآخرتك. مبارك نجاحك!', 'msg')
      : el('div', 'لم توفق في هذه المرحلة، نتمنى لك التوفيق.', 'msg no'));
  cert.append(inn);
  const act = el('div', null, 'actions'), pr = el('button', 'طباعة / حفظ كـ PDF', 'ghost'); pr.onclick = () => window.print();
  act.append(pr); out.append(cert, act);
  cert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
$('go').onclick = search;
$('num').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

(async () => {
  const { data } = await db.rpc('get_top');
  if (!data || !data.length) return;
  const by = {}; data.forEach(r => (by[r.branch] ||= []).push(r));
  Object.entries(by).forEach(([b, rows]) => {
    $('top').append(el('h3', 'الأوائل – ' + b));
    const t = el('div', null, 'tbl');
    rows.forEach(r => { const d = el('div'); d.append(el('span', 'المركز ' + (ORD[r.rk] || r.rk), 'n'), el('span', r.name), el('span', r.score, 's')); t.append(d); });
    $('top').append(t);
  });
})();
</script>
</body>
</html>
