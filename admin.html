<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم – مسابقة مسجد النور</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#093528;--green:#0e4a3a;--page:#f3f6f4;--card:#fff;--ink:#14302a;--mute:#5c726a;--brass:#b8893a;--brass2:#e3c47d;--line:#d6e1da;--mint:#e6efe9;--bad:#8a3b2e}
@media (prefers-color-scheme:dark){:root{--deep:#06201a;--green:#0b3a2e;--page:#0c1a16;--card:#122622;--ink:#e8f0ea;--mute:#9db3a9;--brass:#d9aa4a;--brass2:#f0d28c;--line:#254038;--mint:#16312a;--bad:#e5a595}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
h1{font-family:Amiri,serif;margin:0;font-size:26px;font-weight:700}
h2{font-size:19px;margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;background:linear-gradient(180deg,var(--deep),var(--green));color:#f5f8f4;border-bottom:3px solid var(--brass);position:sticky;top:0;z-index:5}
.wrap{max-width:1040px;margin:22px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 12px 30px -22px rgba(6,32,26,.5)}
input,select,button{font:inherit;padding:10px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--page);color:inherit}
button{background:var(--green);color:#fff;border-color:transparent;font-weight:700;cursor:pointer;transition:background .15s}
button:hover{background:var(--deep)}
@media (prefers-color-scheme:dark){button{color:#1a1405;background:var(--brass)}button:hover{background:var(--brass2)}}
button.sec{background:transparent;color:var(--ink);border-color:var(--line)}button.sec:hover{background:var(--mint)}
button.del{background:transparent;color:var(--bad);border-color:var(--bad)}button.del:hover{background:var(--bad);color:#fff}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,137,58,.25)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tools input[type=search]{flex:1;min-width:170px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:780px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--mint);font-weight:700;font-size:14px}
tbody tr:hover{background:var(--mint)}tbody tr:last-child td{border-bottom:0}
.top1 td:first-child{border-right:4px solid var(--brass);font-weight:800;color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.msg{padding:10px 14px;border-radius:10px;margin:0 0 12px;background:rgba(184,137,58,.16);font-weight:600}
.msg.err{background:rgba(138,59,46,.12);color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:500px;width:92%;padding:22px}
dialog label{margin-top:10px}
dialog::backdrop{background:rgba(6,32,26,.55)}
.hide{display:none}
#count{color:var(--mute);font-size:14px;margin:10px 0 0}
</style>
</head>
<body>
<div class="bar"><h1>لوحة التحكم – مسجد النور</h1><button id="logout" class="sec hide" style="color:#fff;border-color:#ffffff66;background:transparent">تسجيل الخروج</button></div>
<div class="wrap">

<section id="login" class="card" style="max-width:380px;margin:40px auto">
  <h2 style="margin-top:0">تسجيل الدخول</h2>
  <label>البريد الإلكتروني<input id="em" type="email" style="width:100%" autocomplete="username"></label><br>
  <label>كلمة المرور<input id="pw" type="password" style="width:100%" autocomplete="current-password"></label><br>
  <button id="loginBtn" style="width:100%">دخول</button>
  <div id="loginMsg" class="msg err hide"></div>
</section>

<div id="app" class="hide">
  <div class="card">
    <div class="tools">
      <input id="q" type="search" placeholder="🔍 بحث بالرقم أو الاسم">
      <select id="fb"><option value="">كل الفروع</option></select>
      <button id="add">➕ إضافة متسابق</button>
      <button id="xl" class="sec">📥 رفع ملف Excel</button>
      <input id="file" type="file" accept=".xlsx,.xls,.csv" class="hide">
      <button id="exp" class="sec">⬇️ تصدير النتائج</button>
    </div>
    <div id="status"></div>
    <div class="scroll"><table>
      <thead><tr><th>المركز</th><th>الرقم</th><th>الاسم</th><th>الفرع</th><th>الحفظ /70</th><th>التجويد /30</th><th>المجموع</th><th>إجراءات</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p id="count"></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0">🏆 الإعدادات</h2>
    <div class="grid">
      <label>درجة النجاح (من 100)<input id="pass" type="number" step="0.5" style="width:100%"></label>
      <label>عدد الأوائل في كل فرع<input id="topn" type="number" min="1" style="width:100%"></label>
      <label>إظهار قائمة الأوائل للعامة<select id="showtop" style="width:100%"><option value="false">مخفية</option><option value="true">ظاهرة</option></select></label>
    </div><br>
    <button id="saveSet">حفظ الإعدادات</button>
  </div>
</div>
</div>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h3 id="dt" style="margin-top:0"></h3>
    <label>رقم المتسابق<input id="fn" required style="width:100%"></label>
    <label>الاسم<input id="fname" required style="width:100%"></label>
    <label>الفرع<select id="fbr" style="width:100%"></select></label>
    <label>درجة الحفظ (من 70)<input id="fh" type="number" step="0.01" min="0" max="70" required style="width:100%"></label>
    <label>درجة التجويد (من 30)<input id="ft" type="number" step="0.01" min="0" max="30" required style="width:100%"></label>
    <div class="tools" style="margin-top:14px"><button value="ok">حفظ</button><button type="button" id="cancel" class="sec">إلغاء</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(CFG.URL, CFG.KEY);
const BR = ['القرآن كامل','نصف القرآن','ربع القرآن','خمسة أجزاء'];
const $ = id => document.getElementById(id);
const norm = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const el = (t, txt) => { const e = document.createElement(t); if (txt != null) e.textContent = txt; return e; };
let all = [], editing = null;

BR.forEach(b => { $('fb').append(new Option(b, b)); $('fbr').append(new Option(b, b)); });

function note(msg, err) { const s = $('status'); s.replaceChildren(); const d = el('div', msg); d.className = 'msg' + (err ? ' err' : ''); s.append(d); }

// ---- دخول ----
async function init() {
  const { data } = await db.auth.getSession();
  data.session ? showApp() : ($('login').classList.remove('hide'));
}
$('loginBtn').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { const m = $('loginMsg'); m.textContent = 'البريد أو كلمة المرور غير صحيحة.'; m.classList.remove('hide'); return; }
  showApp();
};
$('logout').onclick = async () => { await db.auth.signOut(); location.reload(); };
async function showApp() {
  $('login').classList.add('hide'); $('app').classList.remove('hide'); $('logout').classList.remove('hide');
  await Promise.all([load(), loadSettings()]);
}

// ---- البيانات والترتيب (داخل كل فرع) ----
async function load() {
  const { data, error } = await db.from('contestants').select('*').order('number');
  if (error) return note('تعذّر تحميل النتائج: ' + error.message, true);
  all = data;
  const byB = {};
  all.forEach(c => (byB[c.branch] ||= []).push(c));
  Object.values(byB).forEach(list => {
    const sorted = [...list].sort((a, b) => b.score - a.score);
    list.forEach(c => c.rk = 1 + sorted.filter(x => x.score > c.score).length);
  });
  render();
}
function render() {
  const q = norm($('q').value).toLowerCase(), fb = $('fb').value;
  const list = all.filter(c => (!fb || c.branch === fb) && (!q || c.number.toLowerCase().includes(q) || c.name.toLowerCase().includes(q)))
    .sort((a, b) => a.branch === b.branch ? a.rk - b.rk : BR.indexOf(a.branch) - BR.indexOf(b.branch));
  const tb = $('rows'); tb.replaceChildren();
  list.forEach(c => {
    const tr = el('tr'); if (c.rk <= 3) tr.className = 'top1';
    [c.rk, c.number, c.name, c.branch, c.hifz, c.tajweed, c.score].forEach(v => tr.append(el('td', v)));
    const td = el('td');
    const e = el('button', '✏️ تعديل'); e.className = 'sec'; e.onclick = () => openForm(c);
    const d = el('button', '🗑️ حذف'); d.className = 'del'; d.style.marginInlineStart = '6px'; d.onclick = () => del(c);
    td.append(e, d); tr.append(td); tb.append(tr);
  });
  $('count').textContent = 'عدد المتسابقين المعروض: ' + list.length + ' من ' + all.length;
}
$('q').oninput = render; $('fb').onchange = render;

// ---- إضافة / تعديل / حذف ----
function openForm(c) {
  editing = c || null;
  $('dt').textContent = c ? 'تعديل النتيجة' : 'إضافة متسابق';
  $('fn').value = c?.number ?? ''; $('fname').value = c?.name ?? ''; $('fbr').value = c?.branch ?? BR[0]; $('fh').value = c?.hifz ?? ''; $('ft').value = c?.tajweed ?? '';
  $('dlg').showModal();
}
$('add').onclick = () => openForm(null);
$('cancel').onclick = () => $('dlg').close();
$('f').onsubmit = async e => {
  const row = { number: norm($('fn').value), name: $('fname').value.trim(), branch: $('fbr').value, hifz: Number(norm($('fh').value)), tajweed: Number(norm($('ft').value)) };
  const { error } = editing ? await db.from('contestants').update(row).eq('id', editing.id) : await db.from('contestants').insert(row);
  if (error) { e.preventDefault(); return note(error.code === '23505' ? 'هذا الرقم مسجّل من قبل.' : 'خطأ: ' + error.message, true); }
  note('تم الحفظ.'); await load();
};
async function del(c) {
  if (!confirm('حذف المتسابق ' + c.name + ' (رقم ' + c.number + ')؟ لا يمكن التراجع.')) return;
  const { error } = await db.from('contestants').delete().eq('id', c.id);
  error ? note('خطأ: ' + error.message, true) : (note('تم الحذف.'), load());
}

// ---- رفع Excel ----
$('xl').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer());
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
  const ok = [], bad = [];
  rows.forEach((r, i) => {
    const g = k => { const key = Object.keys(r).find(x => x.trim().startsWith(k)); return key ? r[key] : ''; };
    const row = { number: norm(g('رقم')), name: String(g('الاسم')).trim(), branch: String(g('الفرع')).trim(), hifz: Number(norm(g('الحفظ'))), tajweed: Number(norm(g('التجويد'))) };
    if (row.number && row.name && BR.includes(row.branch) && norm(g('الحفظ')) !== '' && norm(g('التجويد')) !== ''
        && row.hifz >= 0 && row.hifz <= 70 && row.tajweed >= 0 && row.tajweed <= 30) ok.push(row);
    else if (Object.values(r).some(v => String(v).trim())) bad.push(i + 2);
  });
  if (!ok.length) { e.target.value = ''; return note('لم أجد صفوفًا صالحة. استخدم قالب Excel كما هو.', true); }
  const msg = 'سيتم إضافة/تحديث ' + ok.length + ' متسابق' + (bad.length ? ' (صفوف بها أخطاء ستُتجاهل: ' + bad.join('، ') + ')' : '') + '. متابعة؟';
  if (confirm(msg)) {
    const { error } = await db.from('contestants').upsert(ok, { onConflict: 'number' });
    error ? note('خطأ: ' + error.message, true) : (note('تم رفع ' + ok.length + ' نتيجة.'), load());
  }
  e.target.value = '';
};

// ---- تصدير ----
$('exp').onclick = () => {
  const data = all.map(c => ({ 'رقم المتسابق': c.number, 'الاسم': c.name, 'الفرع': c.branch, 'الحفظ': c.hifz, 'التجويد': c.tajweed, 'المجموع': c.score, 'المركز': c.rk }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), 'النتائج');
  XLSX.writeFile(wb, 'النتائج.xlsx');
};

// ---- الإعدادات ----
async function loadSettings() {
  const { data } = await db.from('settings').select('*').eq('id', 1).single();
  if (data) { $('pass').value = data.pass_score; $('topn').value = data.top_count; $('showtop').value = String(data.show_top); }
}
$('saveSet').onclick = async () => {
  const { error } = await db.from('settings').update({ pass_score: Number($('pass').value), top_count: Number($('topn').value), show_top: $('showtop').value === 'true' }).eq('id', 1);
  error ? note('خطأ: ' + error.message, true) : note('تم حفظ الإعدادات.');
};
init();
</script>
</body>
</html>
